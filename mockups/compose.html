<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
	@font-face { font-family: "Raleway"; src: url(../assets/fonts/raleway-latin.woff2) format("woff2"); font-weight: 100 900; }
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { width: 1600px; height: 1000px; overflow: hidden; }
	.stage { position: relative; width: 1600px; height: 1000px; background: var(--bg); overflow: hidden; }
	.stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 30% 20%, rgba(255, 255, 255, var(--lift, .18)), transparent 60%); }
	.win { position: absolute; left: 96px; top: 92px; width: 1140px; border-radius: 12px; overflow: hidden; background: var(--bar); box-shadow: 0 2px 4px rgba(0, 0, 0, .06), 0 40px 90px -20px rgba(0, 0, 0, var(--shadow, .35)); }
	.bar { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 14px; }
	.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
	.url { margin-left: 18px; flex: 1; max-width: 420px; height: 20px; border-radius: 6px; background: var(--pill); font: 500 12px/20px "Raleway", sans-serif; color: var(--urlc); padding: 0 10px; letter-spacing: .01em; }
	.win img { display: block; width: 1140px; height: auto; }
	.phone { position: absolute; right: 104px; bottom: 74px; width: 306px; padding: 10px; border-radius: 46px; background: #0f1011; box-shadow: 0 0 0 1px rgba(255, 255, 255, .06) inset, 0 50px 90px -24px rgba(0, 0, 0, .5); }
	.phone img { display: block; width: 286px; height: 619px; object-fit: cover; object-position: top; border-radius: 36px; }
	.island { position: absolute; top: 22px; left: 50%; width: 86px; height: 24px; margin-left: -43px; border-radius: 12px; background: #0f1011; }
</style>
</head>
<body>
<div class="stage" id="stage">
	<div class="win"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="url" id="url"></span></div><img id="d" alt=""></div>
	<div class="phone"><img id="m" alt=""></div>
</div>
<script>
	var q = new URLSearchParams(location.search);
	var s = document.getElementById('stage').style;
	s.setProperty('--bg', q.get('bg') || '#d9d2c4');
	var dark = q.get('chrome') === 'dark';
	s.setProperty('--bar', dark ? '#1d1f22' : '#f3f1ec');
	s.setProperty('--dot', dark ? '#3a3d42' : '#d9d5cc');
	s.setProperty('--pill', dark ? '#2a2d31' : '#e6e2d9');
	s.setProperty('--urlc', dark ? '#9a9da3' : '#7d796f');
	s.setProperty('--lift', q.get('lift') || '.18');
	s.setProperty('--shadow', q.get('shadow') || '.35');
	document.getElementById('url').textContent = q.get('url') || '';
	document.getElementById('d').src = q.get('d');
	document.getElementById('m').src = q.get('m');
</script>
</body>
</html>
